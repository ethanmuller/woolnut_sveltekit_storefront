<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Tilt+Warp&display=swap" rel="stylesheet">
    

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

<style>

body, html {
	padding: 0;
	margin: 0;
}

* {
  box-sizing: border-box;
}

.c-catalog, .c-nav {
  max-width: 776px;
  margin: 0 auto;
}

a {
	color: inherit;
	text-decoration: none;
}

.inter-regular {
  font-family: "Inter", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
}

.bodoni-moda-regular {
  font-family: "Bodoni Moda", serif;
  font-optical-sizing: none;
  font-weight: 400;
  /* 600 */
  font-style: normal;
}

.tilt-warp {
  font-family: "Tilt Warp", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  font-variation-settings:
    "XROT" 0,
    "YROT" 0;
}

.c-logo {
  position: relative;
  z-index: 1;
  mix-blend-mode: multiply;
}

.c-logo__img {
	width: 80px;
}
@media (min-width: 660px)	{
	.c-logo {
	}
}

.c-catalog {
		display: grid;
		grid-template-columns: 1fr 1fr;
		padding: 1rem;
		gap: 1rem;
}

@media (min-width: 660px)	{
	.c-catalog {
		grid-template-columns: 1fr 1fr 1fr;
		gap: 50px;
		padding: 3rem;
	}
}

@media (min-width: 830px)	{
	.c-catalog {
		padding: 0;
	}
}

.c-listing {
}

.c-listing__image {
	max-width: 100%;
}

.c-listing__text {
	display: flex;
}

.c-listing__name {
	font-size: 14px;
	flex: 1;
	line-height: 1;
}

.c-listing__price {
	font-size: 18px;
	line-height: 1;
  width: 4em;
  text-align: right;
}

.c-alpha-image {
  width: 100%;
  max-width: 444px;
  display: block;
}

.c-product-detail {
  display: flex;
  flex-direction: column;
}

.c-product-detail__buy {
  margin-top: 2rem;
}

@media (min-width: 600px) {
  .c-product-detail__buy {
    margin-top: auto;
  }
}

.c-product-detail__name {
  font-size: 32px;
  line-height: 1.3;
  font-weight: 400;
  margin: 0;
}

.c-btn {
  background-color: #5E1F0C;
  color: #FFEDAC;

  font-size: 16px;
  border: none;
  border-radius: 2px;
  padding: 12px 20px;
  text-transform: uppercase;
  min-width: 160px;
}

.c-product-detail__price {
  font-size: 32px;
  line-height: 1.3;
}

.c-complete {
  display: flex;
  flex-direction: column;
  align-items: center;
}


.c-complete__title {
  position: relative;
  margin-bottom: 3em;
  font-size: 1.3rem;
}

@media (min-width: 800px) {
  .c-complete__title {
    margin-bottom: 10vh;
    margin-top: 10vh;
  }
}

.c-complete h1 {
  font-size: 1em;
  display: inline-block;
  font-weight: normal;
  text-transform: uppercase;
  line-height: 1;
  padding: 0.2em;
  color: #003DB4;
  background-color: #B6C6FF;
  box-shadow: #E7FBFF 0 0 0 calc(0.4em * 1),
              #76ACAF 0 0 0 calc(0.4em * 2),
              #FFC671 0 0 0 calc(0.4em * 3),
              #FCEBFF 0 0 0 calc(0.4em * 4);
}

@media (min-width: 600px) {
  .c-complete__title {
    font-size: 2.5rem;
  }
}

@media (min-width: 800px) {
  .c-complete__title {
    font-size: calc(1rem + 5vw);
  }
}

@media (min-width: 1300px) {
  .c-complete__title {
    font-size: 5rem;
  }
}

.c-complete__body {
  text-align: left;
  max-width: 440px;
  margin: 0 auto;
  padding: 0 2rem;
}

.c-complete__graphic {
  position: absolute;
  bottom: 0;
  right: 0;

    font-size: 3em;
  width: 1.1959em;
  height: 1em;

  transform: scale(0.6) translate3d(0, 120%, 0);
  mix-blend-mode: multiply;
}

@media (min-width: 400px) {
  .c-complete__graphic {
    transform: scale(0.6) translate3d(100%, 120%, 0);
  }
}

@media (min-width: 600px) {
  .c-complete__graphic {
    transform: scale(0.6) translate3d(100%, 140%, 0);
  }
}

.c-hyperlink {
  color: #0057FF;
  font-weight: bold;
    text-decoration: underline;
}

.l-product {
  display: flex;
  flex-direction: column;

  width: 100%;
  max-width: 776px;
  margin: 0 auto;
}

@media (min-width: 600px) {
  .l-product {
    flex-direction: row;
  }
}

.l-product__left {
  width: 100%;
  max-width: 444px;
}

.l-product__right {
  width: 100%;
  max-width: 332px;
  padding-top: 20px;
  text-align: right;
  padding-right: 20px;
  align-self: end;
}

@media (min-width: 600px) {
  .l-product__right {
    padding-top: 0;
    align-self: normal;
  }
}

@media (min-width: 600px) {
  .l-product__right {
    text-align: left;
    padding-right: 0;
    padding-left: 80px;
  }
}

</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
